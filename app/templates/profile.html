{% extends "layout.html" %}
{% block content %}
<h2>User Profile</h2>
<p><strong>Name:</strong> {{ user.first_name }} {{ user.last_name }}</p>
<p><strong>ID/Passport:</strong> {{ user.national_id }}</p>

<h3>Car Info (optional)</h3>
<form method="POST">
    Type: <input type="text" name="car_type" value="{{ user.car_type or '' }}"><br>
    Model: <input type="text" name="car_model" value="{{ user.car_model or '' }}"><br>
    Year: <input type="number" name="year_of_make" value="{{ user.year_of_make or '' }}"><br>
    Seats: <input type="number" name="seats" value="{{ user.seats or '' }}"><br>
    Fuel Type:
    <select name="fuel_type">
        <option value="">-- select --</option>
        <option value="Petrol" {% if user.fuel_type == 'Petrol' %}selected{% endif %}>Petrol</option>
        <option value="Diesel" {% if user.fuel_type == 'Diesel' %}selected{% endif %}>Diesel</option>
        <option value="Electric" {% if user.fuel_type == 'Electric' %}selected{% endif %}>Electric</option>
        <option value="Other" {% if user.fuel_type == 'Other' %}selected{% endif %}>Other</option>
    </select><br>
    Avg. Consumption (€/100km): <input type="number" step="0.1" name="avg_consumption" value="{{ user.avg_consumption or '' }}"><br>
    <button type="submit">Save</button>
</form>
{% endblock %}
